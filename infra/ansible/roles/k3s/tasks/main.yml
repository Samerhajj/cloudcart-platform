---
- name: Check if k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_installed

- name: Install k3s
  shell: curl -sfL https://get.k3s.io | sh -
  when: not k3s_installed.stat.exists

- name: Wait for k3s node to be ready
  command: k3s kubectl get nodes
  register: k3s_node_status
  until: "'Ready' in k3s_node_status.stdout"
  retries: 15
  delay: 5
  changed_when: false

- name: Check if Helm is already installed
  stat:
    path: /usr/local/bin/helm
  register: helm_installed

- name: Install Helm
  shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: not helm_installed.stat.exists

- name: Set kubeconfig permissions for ubuntu user
  file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Create .kube directory for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy kubeconfig to ubuntu user's home
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Apply Kubernetes namespace
  become: yes
  become_user: ubuntu
  command: k3s kubectl apply -f /home/ubuntu/cloudcart-platform/kubernetes/namespace.yaml

- name: Apply Kubernetes service
  become: yes
  become_user: ubuntu
  command: k3s kubectl apply -f /home/ubuntu/cloudcart-platform/kubernetes/service.yaml

- name: Check if Prometheus Helm repo already added
  become: yes
  become_user: ubuntu
  command: helm repo list
  register: helm_repo_list
  changed_when: false
  failed_when: false

- name: Add Prometheus community Helm repo
  become: yes
  become_user: ubuntu
  command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  when: "'prometheus-community' not in helm_repo_list.stdout"

- name: Update Helm repos
  become: yes
  become_user: ubuntu
  command: helm repo update
