---
- name: Install prerequisite packages
  apt:
    name:
      - openjdk-21-jre
      - fontconfig
    state: present
    update_cache: yes

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Jenkins GPG key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'
    force: yes

- name: Add Jenkins apt repository
  copy:
    dest: /etc/apt/sources.list.d/jenkins.list
    content: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/\n"

- name: Update apt cache after adding Jenkins repo
  apt:
    update_cache: yes

- name: Skip Jenkins setup wizard and configure memory limit
  lineinfile:
    path: /etc/default/jenkins
    regexp: '^JAVA_ARGS='
    line: 'JAVA_ARGS="-Xms128m -Xmx384m -Djenkins.install.runSetupWizard=false"'
    create: yes

- name: Install Jenkins
  apt:
    name: jenkins
    state: present

- name: Add jenkins user to ubuntu group for repository access
  user:
    name: jenkins
    groups: ubuntu
    append: yes

- name: Check if safe.directory already configured for jenkins
  shell: sudo -u jenkins git config --global --get-all safe.directory
  register: safe_dir_check
  failed_when: false
  changed_when: false

- name: Mark /opt/cloudcart-platform as safe git directory for jenkins user
  shell: sudo -u jenkins git config --global --add safe.directory /opt/cloudcart-platform
  when: "'/opt/cloudcart-platform' not in safe_dir_check.stdout"

- name: Create .kube directory for jenkins user
  file:
    path: /home/jenkins/.kube
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Copy kubeconfig to jenkins user's home
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/jenkins/.kube/config
    remote_src: yes
    owner: jenkins
    group: jenkins
    mode: '0600'

- name: Create Jenkins init scripts directory
  file:
    path: /var/lib/jenkins/init.groovy.d
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Create default admin user via Groovy script
  copy:
    dest: /var/lib/jenkins/init.groovy.d/basic-security.groovy
    owner: jenkins
    group: jenkins
    mode: '0644'
    content: |
      import jenkins.model.*
      import hudson.security.*
      import jenkins.security.ApiTokenProperty
      import hudson.model.User

      def instance = Jenkins.getInstance()
      def hudsonRealm = new HudsonPrivateSecurityRealm(false)
      hudsonRealm.createAccount("{{ jenkins_admin_user }}", "{{ jenkins_admin_password }}")
      instance.setSecurityRealm(hudsonRealm)

      def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
      strategy.setAllowAnonymousRead(false)
      instance.setAuthorizationStrategy(strategy)
      instance.save()

      def user = User.get("{{ jenkins_admin_user }}")
      def apiTokenProperty = user.getProperty(ApiTokenProperty.class)
      def tokenFile = new File("/var/lib/jenkins/api_token.txt")
      if (!tokenFile.exists()) {
          def result = apiTokenProperty.tokenStore.generateNewToken("automation")
          user.save()
          tokenFile.text = result.plainValue
      }

- name: Download Jenkins plugin manager CLI
  get_url:
    url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.13.2/jenkins-plugin-manager-2.13.2.jar
    dest: /opt/jenkins-plugin-manager.jar
    mode: '0644'

- name: Check if plugins already installed
  stat:
    path: /var/lib/jenkins/plugins/github.jpi
  register: jenkins_plugins_installed

- name: Install required Jenkins plugins
  shell: >
    sudo java -jar /opt/jenkins-plugin-manager.jar
    --war /usr/share/java/jenkins.war
    --plugin-download-directory /var/lib/jenkins/plugins
    --plugins git workflow-aggregator ssh-agent github github-api pipeline-stage-view
  when: not jenkins_plugins_installed.stat.exists

- name: Fix ownership of Jenkins plugins directory
  file:
    path: /var/lib/jenkins/plugins
    owner: jenkins
    group: jenkins
    recurse: yes
  become: yes

- name: Ensure Jenkins service is running and enabled
  service:
    name: jenkins
    state: restarted
    enabled: yes

- name: Wait for Jenkins to be fully up after restart
  uri:
    url: "http://localhost:8080/login"
    status_code: 200
  register: jenkins_ready
  retries: 15
  delay: 5
  until: jenkins_ready.status == 200

- name: Read Jenkins API token
  slurp:
    src: /var/lib/jenkins/api_token.txt
  register: api_token_raw

- name: Set API token fact
  set_fact:
    jenkins_api_token: "{{ api_token_raw.content | b64decode | trim }}"

- name: Copy pipeline job config
  copy:
    src: pipeline-config.xml
    dest: /tmp/pipeline-config.xml

- name: Check if pipeline job already exists
  uri:
    url: "http://localhost:8080/job/cloudcart-pipeline/api/json"
    method: GET
    user: "{{ jenkins_admin_user }}"
    password: "{{ jenkins_api_token }}"
    force_basic_auth: yes
    status_code: [200, 404]
  register: job_check

- name: Create Jenkins pipeline job
  uri:
    url: "http://localhost:8080/createItem?name=cloudcart-pipeline"
    method: POST
    user: "{{ jenkins_admin_user }}"
    password: "{{ jenkins_api_token }}"
    force_basic_auth: yes
    headers:
      Content-Type: "application/xml"
    body: "{{ lookup('file', 'roles/jenkins/files/pipeline-config.xml') | replace('__DEPLOY_HOST_PLACEHOLDER__', ansible_host) }}"
    status_code: 200
  when: job_check.status == 404

- name: Update Jenkins pipeline job with current instance IP
  uri:
    url: "http://localhost:8080/job/cloudcart-pipeline/config.xml"
    method: POST
    user: "{{ jenkins_admin_user }}"
    password: "{{ jenkins_api_token }}"
    force_basic_auth: yes
    headers:
      Content-Type: "application/xml"
    body: "{{ lookup('file', 'roles/jenkins/files/pipeline-config.xml') | replace('__DEPLOY_HOST_PLACEHOLDER__', ansible_host) }}"
    status_code: 200
  when: job_check.status == 200

- name: Add jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: yes

- name: Restart Jenkins to apply docker group membership
  service:
    name: jenkins
    state: restarted
