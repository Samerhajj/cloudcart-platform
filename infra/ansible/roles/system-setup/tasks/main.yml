---
- name: Check if swap file already exists
  stat:
    path: /swapfile
  register: swap_file

- name: Create 2GB swap file
  command: fallocate -l 2G /swapfile
  when: not swap_file.stat.exists

- name: Set swap file permissions
  file:
    path: /swapfile
    mode: '0600'
  when: not swap_file.stat.exists

- name: Format swap file
  command: mkswap /swapfile
  when: not swap_file.stat.exists

- name: Enable swap file
  command: swapon /swapfile
  when: not swap_file.stat.exists

- name: Add swap file to fstab for persistence across reboots
  lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present

- name: Install git
  apt:
    name: git
    state: present
    update_cache: yes

- name: Clone CloudCart repository early so later roles can reference it
  become: yes
  become_user: ubuntu
  git:
    repo: "https://github.com/Samerhajj/cloudcart-platform.git"
    dest: /home/ubuntu/cloudcart-platform
    version: main
    force: yes