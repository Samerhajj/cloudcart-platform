# Trimmed configuration for kube-prometheus-stack
# Aggressively reduced for t3.small after repeated resource exhaustion incidents

alertmanager:
  enabled: false

grafana:
  enabled: true
  resources:
    requests:
      memory: "96Mi"
      cpu: "50m"
    limits:
      memory: "150Mi"
      cpu: "100m"
  service:
    type: NodePort
    nodePort: 30300
  sidecar:
    dashboards:
      enabled: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

prometheus:
  prometheusSpec:
    resources:
      requests:
        memory: "150Mi"
        cpu: "75m"
      limits:
        memory: "300Mi"
        cpu: "150m"
    retention: 2h
    storageSpec: {}
    scrapeInterval: 30s

prometheusOperator:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: true
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"

kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false